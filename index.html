<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
        }
        .card {
            text-align: center;
            padding: 2.5rem;
            border: 1px solid #333;
            border-radius: 12px;
            background: #111;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        h1 {
            color: #0070f3;
            margin-bottom: 0.5rem;
        }
        p {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola Mundo! 🚀</h1>
        <p>Mi primera página web publicada con éxito en Vercel.</p>
    </div>
</body>
</html>
